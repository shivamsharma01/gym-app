# Local development defaults. Activate with SPRING_PROFILES_ACTIVE=dev.
# Docker compose "spa" frontend is http://localhost:8088; Vite is :5173 / :4173.
# Prefer same-origin (empty VITE_API_BASE + nginx proxy) so browsers avoid CORS;
# these origins cover intentional cross-origin calls (Vite → :8080, SPA → :8080).

app:
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - http://localhost:4173
      - http://127.0.0.1:4173
      - http://localhost:8088
      - http://127.0.0.1:8088
