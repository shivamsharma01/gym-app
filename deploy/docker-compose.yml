# Portable production stack — MySQL + Spring Boot + Nginx API edge.
# React SPA is NOT on the VPS (host on Cloudflare Pages or any static CDN).
#
# Quick start (from repo root):
#   cp deploy/.env.example deploy/.env   # edit secrets
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env --profile full up -d --build
#
# Optional local SPA+proxy (laptop only, not for VPS):
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env --profile spa up -d --build
#
# Windows TrueFace gateway is NOT in this file — it runs on the gym LAN and dials
# wss://<public-host>/gateway (see deploy/README.md).
#
# Monitoring (Prometheus, node-exporter, cAdvisor, Grafana, Loki, Alloy) is in this
# file under profile full. Paths are relative to this file, so on the VPS they resolve
# under /opt/gym/deploy/. Do not run a second compose project from /opt.

name: gym

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  mysql:
    image: mysql:8.4
    container_name: gym-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?set MYSQL_DATABASE in deploy/.env}
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER in deploy/.env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in deploy/.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in deploy/.env}
    # Localhost-only admin access. Backend reaches MySQL on gym-net (no public bind).
    # Set MYSQL_HOST_PORT= empty and remove this ports block to hide MySQL from the host entirely.
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3306}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --max_connections=${MYSQL_MAX_CONNECTIONS:-100}
      - --innodb_buffer_pool_size=${MYSQL_INNODB_BUFFER_POOL_SIZE:-256M}
    volumes:
      - gym-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - gym-net
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: ${MYSQL_MEMORY_LIMIT:-1g}
          cpus: "${MYSQL_CPUS:-1.0}"
        reservations:
          memory: ${MYSQL_MEMORY_RESERVATION:-256m}

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    image: gym-backend:${IMAGE_TAG:-local}
    container_name: gym-backend
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      # Membership start/end days and the hourly access check use the server's local date.
      TZ: ${GYM_TIMEZONE:-Asia/Kolkata}
      SERVER_PORT: "8080"
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-5}
      APP_SECURITY_JWT_SECRET: ${APP_SECURITY_JWT_SECRET:?set APP_SECURITY_JWT_SECRET in deploy/.env}
      APP_JWT_ACCESS_TTL: ${APP_JWT_ACCESS_TTL:-PT15M}
      APP_JWT_REFRESH_TTL: ${APP_JWT_REFRESH_TTL:-P30D}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8088,http://127.0.0.1:8088,http://localhost:4173,http://127.0.0.1:4173}
      APP_GATEWAY_SHARED_TOKEN: ${APP_GATEWAY_SHARED_TOKEN:-}
      APP_GATEWAY_OUTBOX_DISPATCHER_ENABLED: ${APP_GATEWAY_OUTBOX_DISPATCHER_ENABLED:-true}
      APP_GATEWAY_SIMULATOR_ENABLED: ${APP_GATEWAY_SIMULATOR_ENABLED:-false}
      APP_PUBLIC_TENANT_SLUG: ${APP_PUBLIC_TENANT_SLUG:-}
      APP_PUBLIC_BASE_DOMAIN: ${APP_PUBLIC_BASE_DOMAIN:-}
      APP_BOOTSTRAP_SUPERADMIN_USERNAME: ${APP_BOOTSTRAP_SUPERADMIN_USERNAME:-superadmin}
      APP_BOOTSTRAP_SUPERADMIN_EMAIL: ${APP_BOOTSTRAP_SUPERADMIN_EMAIL:-superadmin@platform.local}
      APP_BOOTSTRAP_SUPERADMIN_FULL_NAME: ${APP_BOOTSTRAP_SUPERADMIN_FULL_NAME:-Platform Super Admin}
      APP_BOOTSTRAP_SUPERADMIN_PASSWORD: ${APP_BOOTSTRAP_SUPERADMIN_PASSWORD:-}
      APP_RATE_LIMIT_ENABLED: ${APP_RATE_LIMIT_ENABLED:-true}
      APP_RATE_LIMIT_LOGIN_PER_MINUTE: ${APP_RATE_LIMIT_LOGIN_PER_MINUTE:-20}
      APP_RATE_LIMIT_REFRESH_PER_MINUTE: ${APP_RATE_LIMIT_REFRESH_PER_MINUTE:-30}
      APP_RATE_LIMIT_ENQUIRY_PER_MINUTE: ${APP_RATE_LIMIT_ENQUIRY_PER_MINUTE:-10}
      APP_RATE_LIMIT_AUTHENTICATED_PER_MINUTE: ${APP_RATE_LIMIT_AUTHENTICATED_PER_MINUTE:-300}
      APP_RATE_LIMIT_REPORTS_PER_MINUTE: ${APP_RATE_LIMIT_REPORTS_PER_MINUTE:-30}
      APP_RATE_LIMIT_PASSWORD_CHANGE_PER_MINUTE: ${APP_RATE_LIMIT_PASSWORD_CHANGE_PER_MINUTE:-10}
      LOG_PATH: /var/log/gym
      # Must match the gym-faces mount below (overrides the dev profile's ./data/faces).
      APP_FACES_DIR: /var/lib/gym/faces
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75.0 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError}
    # Prefer the edge (:80/:443). Keep 8080 on loopback for debugging / SSH tunnels.
    ports:
      - "${BACKEND_PORT:-127.0.0.1:8080}:8080"
    volumes:
      - gym-backend-logs:/var/log/gym
      # Member face photos (resized JPEGs). Back up together with gym-mysql-data.
      - gym-faces:/var/lib/gym/faces
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s
    networks:
      - gym-net
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: ${BACKEND_MEMORY_LIMIT:-2g}
          cpus: "${BACKEND_CPUS:-2.0}"
        reservations:
          memory: ${BACKEND_MEMORY_RESERVATION:-512m}
    profiles:
      - full

  edge:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.edge
    image: gym-edge:${IMAGE_TAG:-local}
    container_name: gym-edge
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${EDGE_HTTP_PORT:-80}:80"
      # Cloudflare Full (strict): uncomment after Origin Cert is in /etc/nginx/ssl/
      - "${EDGE_HTTPS_PORT:-443}:443"
    volumes:
      # Host Origin Cert + key (origin.crt / origin.key). Read-only.
      - /etc/nginx/ssl:/etc/nginx/ssl:ro
      # Use HTTPS nginx config (copy example → nginx.conf on the VPS, or mount the example):
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - gym-net
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: ${EDGE_MEMORY_LIMIT:-128m}
          cpus: "${EDGE_CPUS:-0.5}"
        reservations:
          memory: 32m
    profiles:
      - full

  # Optional: local SPA image (do not use on VPS — host React on Cloudflare instead)
  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        VITE_API_BASE: ${VITE_API_BASE:-}
    image: gym-frontend:${IMAGE_TAG:-local}
    container_name: gym-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8088}:80"
    networks:
      - gym-net
    logging: *default-logging
    profiles:
      - spa

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - gym-net
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: ${PROMETHEUS_MEMORY_LIMIT:-512m}
          cpus: "0.5"
    profiles:
      - full

  # Host metrics without host networking, so :9100 is only on gym-net.
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    pid: host
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --web.listen-address=:9100
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
    networks:
      - gym-net
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: ${NODE_EXPORTER_MEMORY_LIMIT:-128m}
          cpus: "0.25"
    profiles:
      - full

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - gym-net
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: ${CADVISOR_MEMORY_LIMIT:-256m}
          cpus: "0.5"
    profiles:
      - full

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://grafana.kainazi.com}
      GF_SMTP_ENABLED: ${GRAFANA_SMTP_ENABLED:-false}
      GF_SMTP_HOST: ${GRAFANA_SMTP_HOST:-}
      GF_SMTP_USER: ${GRAFANA_SMTP_USER:-}
      GF_SMTP_PASSWORD: ${GRAFANA_SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${GRAFANA_SMTP_FROM_ADDRESS:-}
      GF_SMTP_FROM_NAME: ${GRAFANA_SMTP_FROM_NAME:-Grafana}
      GF_SMTP_STARTTLS_POLICY: ${GRAFANA_SMTP_STARTTLS_POLICY:-MandatoryStartTLS}
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - gym-net
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: ${GRAFANA_MEMORY_LIMIT:-256m}
          cpus: "0.5"
    profiles:
      - full

  loki:
    image: grafana/loki:3.7.0
    container_name: loki
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./monitoring/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    networks:
      - gym-net
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: ${LOKI_MEMORY_LIMIT:-512m}
          cpus: "0.5"
    profiles:
      - full

  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Same named volume as backend (logback file ${LOG_PATH}/gym-backend.log).
      - gym-backend-logs:/var/log/gym:ro
    depends_on:
      - loki
    networks:
      - gym-net
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: ${ALLOY_MEMORY_LIMIT:-256m}
          cpus: "0.25"
    profiles:
      - full

volumes:
  gym-mysql-data:
  gym-backend-logs:
  gym-faces:
  prometheus-data:
  grafana-data:
  loki-data:
  alloy-data:

networks:
  gym-net:
    driver: bridge
    name: gym-net
