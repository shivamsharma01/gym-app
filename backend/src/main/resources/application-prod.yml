# Activated with SPRING_PROFILES_ACTIVE=prod (compose full stack / real deploys).
# DevDataSeeder does not run. OpenAPI UI is off. JWT secret is validated at startup.

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  gateway:
    simulator-enabled: false

logging:
  level:
    root: INFO
    org.springframework.security: WARN
    gym.access: INFO
  file:
    # Used by logback-spring.xml (${LOG_PATH}); default under /tmp if unset.
    path: ${LOG_PATH:/var/log/gym}
