spring:
  application:
    name: gym-backend
  # Do not hardcode an active profile here. Set SPRING_PROFILES_ACTIVE (or
  # -Dspring-boot.run.profiles) explicitly:
  #   local laptop:  SPRING_PROFILES_ACTIVE=dev
  #   VPS / compose: SPRING_PROFILES_ACTIVE=prod
  #   tests:         @ActiveProfiles("test")
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/gym?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:gym}
    password: ${DB_PASSWORD:gym}
    hikari:
      pool-name: gym-hikari
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned exclusively by Flyway. Hibernate never creates/updates/validates it.
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        # health: public (minimal). info/metrics/threaddump: SUPER_ADMIN only.
        # Do NOT expose env, configprops, heapdump, loggers remotely.
        include: health,info,metrics,threaddump
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      show-components: when_authorized
    heapdump:
      enabled: false
    env:
      enabled: false
    configprops:
      enabled: false
    loggers:
      enabled: false
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: gym-backend
    description: Gym SaaS API

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    jwt:
      # Dev-only secret; MUST be overridden via APP_SECURITY_JWT_SECRET in real environments.
      secret: ${APP_SECURITY_JWT_SECRET:dev-only-insecure-secret-change-me-0123456789-0123456789}
      access-token-ttl: ${APP_JWT_ACCESS_TTL:PT15M}
      refresh-token-ttl: ${APP_JWT_REFRESH_TTL:P7D}
      issuer: gym-backend
    lockout:
      max-failed-attempts: 5
      lock-duration: PT15M
  cors:
    # Overridden by APP_CORS_ORIGINS. Dev profile (application-dev.yml) widens local origins.
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8088,http://127.0.0.1:8088}
  gateway:
    # Per-deployment shared token the device gateway may present at the WSS handshake
    # (optional; per-gateway operational credentials after enrollment are preferred).
    shared-token: ${APP_GATEWAY_SHARED_TOKEN:}
    heartbeat-timeout-seconds: 90
    enrollment-ttl: ${APP_GATEWAY_ENROLLMENT_TTL:PT24H}
    credential-ttl: ${APP_GATEWAY_CREDENTIAL_TTL:P90D}
    # In-process mock gateway. Never enable in production — it is not hardware.
    simulator-enabled: ${APP_GATEWAY_SIMULATOR_ENABLED:false}
    outbox:
      dispatcher-enabled: ${APP_GATEWAY_OUTBOX_DISPATCHER_ENABLED:true}
      dispatch-interval-ms: 10000
      batch-size: 50
      max-attempts: 6
      base-backoff: PT5S
      max-backoff: PT10M
      jitter: PT1S
      dispatch-timeout: PT2M
    message-dedupe-ttl: PT24H
    auto-reconcile-interval: PT15M
    auto-reconcile-interval-ms: 900000
  public:
    # Optional fallback when X-Gym-Slug / subdomain are absent. Leave empty — no gym is pre-seeded.
    tenant-slug: ${APP_PUBLIC_TENANT_SLUG:}
    # Production: set to the apex domain so {slug}.example.com maps to that gym.
    # Leave empty for local/dev — use path /g/{slug} and the X-Gym-Slug header instead.
    base-domain: ${APP_PUBLIC_BASE_DOMAIN:}
  bootstrap:
    superadmin:
      username: ${APP_BOOTSTRAP_SUPERADMIN_USERNAME:superadmin}
      email: ${APP_BOOTSTRAP_SUPERADMIN_EMAIL:superadmin@platform.local}
      full-name: ${APP_BOOTSTRAP_SUPERADMIN_FULL_NAME:Platform Super Admin}
      # Prod only: set once to create the first SUPER_ADMIN, then clear from env.
      password: ${APP_BOOTSTRAP_SUPERADMIN_PASSWORD:}
  rate-limit:
    enabled: ${APP_RATE_LIMIT_ENABLED:true}
    login-per-minute: ${APP_RATE_LIMIT_LOGIN_PER_MINUTE:20}
    refresh-per-minute: ${APP_RATE_LIMIT_REFRESH_PER_MINUTE:30}
    enquiry-per-minute: ${APP_RATE_LIMIT_ENQUIRY_PER_MINUTE:10}
    password-change-per-minute: ${APP_RATE_LIMIT_PASSWORD_CHANGE_PER_MINUTE:10}
    authenticated-per-minute: ${APP_RATE_LIMIT_AUTHENTICATED_PER_MINUTE:300}
    reports-per-minute: ${APP_RATE_LIMIT_REPORTS_PER_MINUTE:30}
    retry-after-seconds: ${APP_RATE_LIMIT_RETRY_AFTER_SECONDS:60}

logging:
  level:
    org.springframework.security: INFO
    gym.access: INFO
