# Local development dependencies for the Smart Gym backend.
# Usage: docker compose -f deploy/docker-compose.yml up -d
services:
  mysql:
    image: mysql:8.4
    container_name: gym-mysql
    environment:
      MYSQL_DATABASE: gym
      MYSQL_USER: gym
      MYSQL_PASSWORD: gym
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - gym-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  gym-mysql-data:
