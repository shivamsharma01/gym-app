global:
  scrape_interval: 15s

scrape_configs:

  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  # node-exporter is on gym-net (not the host network), so the instance label is the service name.
  - job_name: node
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: spring-boot
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - backend:8080

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080
