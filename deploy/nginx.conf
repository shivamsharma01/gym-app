# API edge for the VPS — React SPA is hosted elsewhere (e.g. Cloudflare Pages).
# Do not serve the SPA from this config.
#
# Portable: accept any Host (Cloudflare customer domains → this origin).
# Tenant resolution is JWT-based in Spring Boot — not Host / X-Gym-Slug for staff APIs.
#
# Flow: Browser → Cloudflare (public TLS) → this Nginx → Spring Boot on Docker network.
# For origin TLS (Full strict), see nginx.api.https.conf.example.

upstream gym_backend {
    server backend:8080;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # ACME HTTP-01 (uncomment when using certbot webroot on the VPS)
    # location ^~ /.well-known/acme-challenge/ {
    #     root /var/www/certbot;
    # }

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location /api/ {
        proxy_pass http://gym_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Gym-Slug $http_x_gym_slug;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_set_header Authorization $http_authorization;
    }

    location /live {
        proxy_pass http://gym_backend/live;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location /gateway {
        proxy_pass http://gym_backend/gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # health public; metrics/info/threaddump require SUPER_ADMIN JWT (Spring Security)
    location /actuator/ {
        proxy_pass http://gym_backend/actuator/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
        proxy_set_header X-Request-Id $http_x_request_id;
    }

    location / {
        default_type application/json;
        return 404 '{"error":"NOT_FOUND","message":"API host — SPA is served elsewhere"}';
    }
}
