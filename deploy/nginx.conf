server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Simple liveness for compose healthchecks
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # API + OpenAPI (backend)
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Gym-Slug $http_x_gym_slug;
    }

    # Staff live WebSocket feed
    location /live {
        proxy_pass http://backend:8080/live;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Device gateway outbound WebSocket (gym LAN agent → cloud)
    location /gateway {
        proxy_pass http://backend:8080/gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location /actuator/health {
        proxy_pass http://backend:8080/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # SPA history fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
